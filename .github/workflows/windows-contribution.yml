name: Windows required validation
'on':
  workflow_dispatch:
    inputs:
      code_sha:
        type: string
        required: true
permissions:
  contents: read
env:
  PORTABLE_TESTS: tests/life/test_chat_render.py tests/life/test_feishu_bot.py tests/life/test_state_machine_guards.py
    tests/life/test_telegram_bot.py tests/life/test_telegram_mobile.py tests/core/test_release.py
    tests/core/test_cost_control.py tests/core/test_usage.py tests/core/test_project_contract.py
    tests/core/test_contract_authority.py tests/core/test_copilot_parser_refusal.py
    tests/apps/test_bounded_planner_continuation.py tests/life/test_self_referential_acceptance.py
    tests/core/test_operator_messages.py tests/core/test_file_lock.py tests/core/test_daemon_lock.py
    tests/core/test_session_lock_portable.py tests/daemon/test_state_portable.py tests/test_idle_watchdog.py
    tests/test_run_exec_stream_callback.py tests/test_stop_kind_lifecycle.py tests/agent_cli/test_codex_execution_host_failure.py
    tests/apps/test_update.py tests/apps/test_update_dispatch.py tests/apps/test_update_install.py
    tests/core/test_event_catalog.py tests/apps/test_update_launcher.py tests/apps/test_package_update.py
    tests/life/test_execution_host_lifecycle.py tests/life/test_planner_effort_resolution.py
    tests/life/test_planner_host_pause_race.py tests/planner/test_execution_host_failure.py
    tests/test_backend_receipt_classification.py tests/test_provider_turn_cap_restart.py
    tests/tools/test_lean_check.py tests/webapi/test_manager_rotation.py tests/webapi/test_pairing.py
    tests/webapi/test_source_update.py
  WINDOWS_CORE_TESTS: tests/apps/test_cli_parser.py tests/apps/test_tui_launcher.py
    tests/daemon/test_health.py tests/daemon/test_process_workspace.py tests/daemon/test_spawn_admission_portable.py
    tests/daemon/test_spawn_helper.py tests/daemon/test_windows_daemon_control.py
    tests/daemon/test_windows_terminal_process.py tests/core/test_agent_probe.py tests/core/test_windows_job_environment.py
    tests/agent_cli/test_windows_turn_ownership.py tests/agent_cli/test_prompt_stdin_backpressure.py
    tests/agent_cli/test_output_pipe_lifecycle.py tests/agent_cli/test_provider_turn_cap.py
    tests/roles/test_native_shell_contract.py tests/tools/test_subagent_durable_owner.py
    tests/test_opencode_backend.py tests/core/test_backend_readiness.py tests/core/test_cheap_route_models.py
    tests/maintenance/test_repair_pipeline.py tests/maintenance/test_doctor_advisor.py
    tests/test_agent_cli_backend.py tests/test_bootstrap_doctor.py tests/test_doctor.py
    tests/test_install_documentation.py tests/tools/test_setup_readiness.py tests/webapi/test_commands_m1.py
    tests/webapi/test_server_m0.py tests/webapi/test_workspace_v2.py tests/webapi/test_map_datasets.py
    tests/webapi/test_map_live.py tests/webapi/test_map_model.py tests/webapi/test_map_incremental.py
  WINDOWS_COLLECTION_TESTS: tests/core/test_file_lock.py tests/core/test_daemon_lock.py
    tests/daemon/test_life_worker.py tests/manager/test_live_view.py tests/manager/test_manager_session.py
    tests/test_manager_session_lock.py tests/test_engineer_sandbox.py
jobs:
  windows:
    name: "${{ matrix.os }} \xB7 portable surface"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - windows-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.code_sha }}
    - name: Verify exact contribution commit
      shell: bash
      env:
        EXPECTED_SHA: ${{ inputs.code_sha }}
      run: 'actual=$(git rev-parse HEAD)

        echo "Tested commit: $actual"

        test "$actual" = "$EXPECTED_SHA"'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
        cache: pip
    - name: Install
      run: 'python -m pip install --upgrade pip

        python -m pip install -e ''.[qr]''

        python -m pip install pytest

        '
    - name: Test portable surface
      run: python -m pytest -q ${{ env.PORTABLE_TESTS }}
    - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      if: runner.os == 'macOS'
    - name: Smoke macOS uv tool install
      if: runner.os == 'macOS'
      run: 'export UV_TOOL_DIR="$RUNNER_TEMP/argus-tools"

        export UV_TOOL_BIN_DIR="$RUNNER_TEMP/argus-bin"

        uv tool install --python 3.12 .

        "$UV_TOOL_BIN_DIR/argus-skill" --version

        "$UV_TOOL_BIN_DIR/argus" --help

        '
    - name: Smoke Windows direct pip install
      if: runner.os == 'Windows'
      shell: pwsh
      run: 'python -m pip install build

        python -m build --wheel

        python -m pip uninstall -y argus-skill

        python -m pip install --no-deps (Get-ChildItem dist\*.whl).FullName

        argus-skill --version

        argus --help

        '
    - name: Pairing banner survives a redirected console
      shell: bash
      run: 'python -c "

        import sys

        from argus_skill.webapi.pairing import pairing_plan

        plan = pairing_plan(''0.0.0.0'', 8799, lan_address=''192.168.1.50'')

        sys.stderr.write(plan.banner)

        assert plan.url.startswith(''http://192.168.1.50:8799/?token=''), plan.url

        print(''pairing banner OK on'', sys.platform, ''/'', sys.stderr.encoding)

        " > banner.log 2>&1

        cat banner.log

        '
    - name: Run new mobile-source regressions
      run: python -m pytest tests/test_secret_guard.py -k mobile_source -q
