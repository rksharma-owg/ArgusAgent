name: Secret guard baseline control
'on':
  workflow_dispatch:
    inputs:
      code_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.code_sha }}
    - name: Verify exact contribution commit
      shell: bash
      env:
        EXPECTED_SHA: ${{ inputs.code_sha }}
      run: 'actual=$(git rev-parse HEAD)

        echo "Tested commit: $actual"

        test "$actual" = "$EXPECTED_SHA"'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - run: python -m pip install -e ".[qr]" pytest "httpx2>=2.9,<3"
    - run: python -m pytest tests/test_secret_guard.py -q
